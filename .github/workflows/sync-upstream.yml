name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:00 运行一次；可按需修改为其他 cron 频率。
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          # 当前 Fork 默认分支；如需修改目标分支请改这里。
          ref: main
          fetch-depth: 0

      - name: Sync Prometheus-first/helper main into fork main
        env:
          # 如需更换上游仓库或分支，修改以下两个变量。
          UPSTREAM_REPO: Prometheus-first/helper
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          before_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          echo "Current HEAD:   ${before_sha}"
          echo "Upstream HEAD:  ${upstream_sha}"

          if [ "${before_sha}" = "${upstream_sha}"; then
            echo "Fork branch is already up to date. Nothing to sync."
            exit 0
          fi

          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "Sync failed: merge conflict detected between fork main and upstream main."
            echo "Please resolve conflicts manually; workflow will not overwrite fork-only commits."
            exit 1
          fi

          after_sha="$(git rev-parse HEAD)"
          if [ "${after_sha}" = "${before_sha}"; then
            echo "No new commit generated after merge. Nothing to push."
            exit 0
          fi

          git push origin HEAD:main
          echo "Sync completed. New HEAD: ${after_sha}"
